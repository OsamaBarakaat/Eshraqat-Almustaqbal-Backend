name: Build and Deploy Backend to k3s

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/osamabarakaat/eshraqat-almustaqbal-backend
  K8S_NAMESPACE: eshraqat
  DEPLOYMENT_NAME: eshraqat-backend
  CONTAINER_NAME: backend
  SSH_HOST: 79.72.6.51
  SSH_USER: ubuntu
  # Owner of the PAT stored in the GHCR_TOKEN secret (must match the token's owner)
  GHCR_PULL_USER: osamabarakaat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 k3s node)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Backend & Supabase manifests to k3s cluster (eshraqat)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Use a PAT with read:packages; GITHUB_TOKEN expires after the job
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is empty or not set!"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if printf '%s' "${SSH_PRIVATE_KEY}" | grep -q "BEGIN"; then
            printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_ed25519
          elif printf '%s' "${SSH_PRIVATE_KEY}" | tr -d ' \n\r' | base64 -d 2>/dev/null | grep -q "BEGIN"; then
            printf '%s' "${SSH_PRIVATE_KEY}" | tr -d ' \n\r' | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
          else
            {
              echo "-----BEGIN OPENSSH PRIVATE KEY-----"
              printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' | grep -v -- "-----" | tr -d ' '
              echo "-----END OPENSSH PRIVATE KEY-----"
            } > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "ERROR: SSH_PRIVATE_KEY in GitHub Secrets is incomplete or corrupted (received $(printf '%s\n' "${SSH_PRIVATE_KEY}" | wc -l) lines)."
            exit 1
          fi

          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

          SSH_OPTS="-i ${HOME}/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15"

          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/k8s-backend"
          scp ${SSH_OPTS} -r k8s/* "${SSH_USER}@${SSH_HOST}:~/k8s-backend/"

          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" << EOF
            set -e
            cd ~/k8s-backend

            # 1. Ensure namespace exists
            sudo kubectl apply -f 00-namespace.yaml

            # 2. Ensure cert-manager is installed for Let's Encrypt TLS
            if ! sudo kubectl get crd clusterissuers.cert-manager.io >/dev/null 2>&1; then
              sudo kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
              sudo kubectl wait --for=condition=Available --timeout=180s -n cert-manager \
                deployment/cert-manager deployment/cert-manager-webhook deployment/cert-manager-cainjector
            fi
            sudo kubectl apply -f 06-cluster-issuer.yaml

            # 3. Generate and apply backend-secrets once if not already in cluster
            if ! sudo kubectl -n ${K8S_NAMESPACE} get secret backend-secrets >/dev/null 2>&1; then
              chmod +x ./generate-secrets.sh
              ./generate-secrets.sh
              sudo kubectl apply -f 02-secrets.yaml
            fi

            # 4. Ensure GHCR pull secret exists
            sudo kubectl -n ${K8S_NAMESPACE} create secret docker-registry ghcr-secret \
              --docker-server=${REGISTRY} \
              --docker-username=${GHCR_PULL_USER} \
              --docker-password=${GHCR_PULL_TOKEN} \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            # 5. Apply ConfigMap, Supabase stack, Backend Deployment/Service, and Ingress
            sudo kubectl apply -k .

            # 6. Roll out the newly built Backend image
            sudo kubectl -n ${K8S_NAMESPACE} set image deployment/${DEPLOYMENT_NAME} \
              ${CONTAINER_NAME}=${IMAGE_NAME}:${GITHUB_SHA}

            sudo kubectl -n ${K8S_NAMESPACE} rollout status deployment/${DEPLOYMENT_NAME} --timeout=180s
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
