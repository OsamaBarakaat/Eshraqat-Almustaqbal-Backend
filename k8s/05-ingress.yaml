# ==============================================================================
# Traefik Ingress for Backend API (/api/v1, /api/docs, /uploads) & Supabase (/supabase)
# Domain: eshraqatalmustaqbal.com
# ==============================================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: supabase-stripprefix
  namespace: eshraqat
spec:
  stripPrefix:
    prefixes:
      - /supabase
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: eshraqat
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - eshraqatalmustaqbal.com
        - www.eshraqatalmustaqbal.com
      secretName: eshraqat-tls-secret
  rules:
    - host: eshraqatalmustaqbal.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: eshraqat-backend
                port:
                  number: 4000
          - path: /api/docs
            pathType: Prefix
            backend:
              service:
                name: eshraqat-backend
                port:
                  number: 4000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: eshraqat-backend
                port:
                  number: 4000
          - path: /storage/v1
            pathType: Prefix
            backend:
              service:
                name: supabase-kong
                port:
                  number: 8000
    - host: www.eshraqatalmustaqbal.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: eshraqat-backend
                port:
                  number: 4000
          - path: /api/docs
            pathType: Prefix
            backend:
              service:
                name: eshraqat-backend
                port:
                  number: 4000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: eshraqat-backend
                port:
                  number: 4000
          - path: /storage/v1
            pathType: Prefix
            backend:
              service:
                name: supabase-kong
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supabase-ingress
  namespace: eshraqat
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "eshraqat-supabase-stripprefix@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - eshraqatalmustaqbal.com
        - www.eshraqatalmustaqbal.com
      secretName: eshraqat-tls-secret
  rules:
    - host: eshraqatalmustaqbal.com
      http:
        paths:
          - path: /supabase
            pathType: Prefix
            backend:
              service:
                name: supabase-kong
                port:
                  number: 8000
    - host: www.eshraqatalmustaqbal.com
      http:
        paths:
          - path: /supabase
            pathType: Prefix
            backend:
              service:
                name: supabase-kong
                port:
                  number: 8000
