# Copy to 02-secrets.yaml (or run ./generate-secrets.sh to auto-generate all keys)
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: eshraqat
type: Opaque
stringData:
  # ---- PostgreSQL & Prisma Connection ----
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  DATABASE_URL: "postgresql://postgres:CHANGE_ME_POSTGRES_PASSWORD@supabase-db:5432/postgres?schema=public"
  DIRECT_URL: "postgresql://postgres:CHANGE_ME_POSTGRES_PASSWORD@supabase-db:5432/postgres?schema=public"

  # ---- Supabase JWT & API Keys ----
  SUPABASE_JWT_SECRET: "CHANGE_ME_AT_LEAST_32_CHARS_LONG_JWT_SECRET"
  SUPABASE_ANON_KEY: "CHANGE_ME_SUPABASE_ANON_JWT"
  SUPABASE_PUBLISHABLE_KEY: "CHANGE_ME_SUPABASE_ANON_JWT"
  SUPABASE_SERVICE_ROLE_KEY: "CHANGE_ME_SUPABASE_SERVICE_ROLE_JWT"

  # ---- Supabase Studio Basic Auth ----
  DASHBOARD_USERNAME: "supabase"
  DASHBOARD_PASSWORD: "CHANGE_ME_STUDIO_PASSWORD"

  # ---- Backend Application JWT Secrets ----
  JWT_SECRET: "CHANGE_ME_BACKEND_JWT_SECRET"
  JWT_REFRESH_SECRET: "CHANGE_ME_BACKEND_JWT_REFRESH_SECRET"

