apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: eshraqat
data:
  # ---- Domains (update when switching from example.com) ----
  WEBSITE_DOMAIN: "example.com"
  DASHBOARD_DOMAIN: "dashboard.example.com"
  API_DOMAIN: "api.example.com"
  SUPABASE_DOMAIN: "supabase.example.com"

  # ---- URLs derived from domains ----
  SITE_URL: "https://example.com"
  API_EXTERNAL_URL: "https://supabase.example.com"
  SUPABASE_PUBLIC_URL: "https://supabase.example.com"
  SUPABASE_URL: "https://supabase.example.com"
  CORS_ORIGIN: "https://example.com,https://dashboard.example.com"

  # ---- Backend Runtime Configuration ----
  NODE_ENV: "production"
  PORT: "4000"
  SUPABASE_STORAGE_BUCKET: "properties"
  JWT_EXPIRES_IN: "7d"
  JWT_REFRESH_EXPIRES_IN: "30d"
  THROTTLE_TTL: "60"
  THROTTLE_LIMIT: "100"

