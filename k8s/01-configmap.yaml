apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: eshraqat
data:
  # ---- Domain & Sub-path URLs ----
  WEBSITE_DOMAIN: "eshraqatalmustaqbal.com"
  DASHBOARD_DOMAIN: "eshraqatalmustaqbal.com"
  API_DOMAIN: "eshraqatalmustaqbal.com"
  SUPABASE_DOMAIN: "eshraqatalmustaqbal.com"

  SITE_URL: "https://eshraqatalmustaqbal.com"
  API_EXTERNAL_URL: "https://eshraqatalmustaqbal.com/supabase"
  SUPABASE_PUBLIC_URL: "https://eshraqatalmustaqbal.com/supabase"
  SUPABASE_URL: "https://eshraqatalmustaqbal.com/supabase"
  CORS_ORIGIN: "https://eshraqatalmustaqbal.com,https://www.eshraqatalmustaqbal.com"

  # ---- Backend Runtime Configuration ----
  NODE_ENV: "production"
  PORT: "4000"
  SUPABASE_STORAGE_BUCKET: "properties"
  JWT_EXPIRES_IN: "7d"
  JWT_REFRESH_EXPIRES_IN: "30d"
  THROTTLE_TTL: "60"
  THROTTLE_LIMIT: "100"
